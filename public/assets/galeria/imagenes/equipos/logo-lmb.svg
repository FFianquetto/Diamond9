<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Logo Liga Mexicana">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <polygon points="320,70 470,370 170,370" fill="none" stroke="#ECFEFF" stroke-width="10"/>
  <polygon points="320,120 420,340 220,340" fill="none" stroke="#67E8F9" stroke-width="4"/>
  <text x="320" y="250" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="#F8FAFC" letter-spacing="6">LMB</text>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#A5F3FC" letter-spacing="4">LIGA MEXICANA</text>
  <rect x="0" y="0" width="640" height="480" fill="url(#shine)" opacity="0.3"/>
</svg>
