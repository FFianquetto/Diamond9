<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR demo (oficial)</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-image-three": "./assets/vendor/mind-ar/mindar-image-three.prod.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      #control {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #1565c0;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.65);
        padding: 10px 12px;
        border-radius: 8px;
      }
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      a {
        color: #90caf9;
      }
    </style>
  </head>
  <body>
    <div id="control">
      <button id="startButton">Start</button>
      <button id="stopButton">Stop</button>
      <a href="./assets/mind/demo/card.png" target="_blank" rel="noopener"
        >Abrir card.png</a
      >
    </div>
    <div id="status">Listo. Abre card.png en otra pestaña/pantalla y apunta la cámara.</div>
    <div id="container"></div>

    <script type="module">
      import { MindARThree } from 'mindar-image-three';
      import * as THREE from 'three';

      const status = document.querySelector('#status');
      let mindarThree = null;

      const setup = () => {
        mindarThree = new MindARThree({
          container: document.querySelector('#container'),
          imageTargetSrc: './assets/mind/demo/card.mind',
          uiLoading: 'no',
          uiScanning: 'no',
        });
        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);
        const geometry = new THREE.PlaneGeometry(1, 0.55);
        const material = new THREE.MeshBasicMaterial({
          color: 0x00ffff,
          transparent: true,
          opacity: 0.55,
        });
        const plane = new THREE.Mesh(geometry, material);
        anchor.group.add(plane);
        anchor.onTargetFound = () => {
          status.textContent = 'TARGET FOUND · MindAR funciona';
        };
        anchor.onTargetLost = () => {
          status.textContent = 'Target lost · vuelve a centrar card.png';
        };
        return { renderer, scene, camera };
      };

      document.querySelector('#startButton').addEventListener('click', async () => {
        try {
          status.textContent = 'Iniciando…';
          if (!mindarThree) setup();
          const { renderer, scene, camera } = mindarThree;
          await mindarThree.start();
          renderer.setAnimationLoop(() => renderer.render(scene, camera));
          status.textContent = 'Cámara activa. Apunta a card.png';
        } catch (err) {
          status.textContent = 'Error: ' + (err?.message || err);
        }
      });

      document.querySelector('#stopButton').addEventListener('click', () => {
        if (!mindarThree) return;
        mindarThree.renderer.setAnimationLoop(null);
        mindarThree.stop();
        status.textContent = 'Detenido';
      });
    </script>
  </body>
</html>
