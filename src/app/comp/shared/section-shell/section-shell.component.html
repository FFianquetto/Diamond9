<section class="section-page page-shell">
  <div class="section-inner">
    <header class="section-header">
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1>{{ title }}</h1>
      @if (lede) {
        <p class="lede">{{ lede }}</p>
      }
    </header>

    @if (pills.length) {
      <app-pill-switch
        [pills]="pills"
        [active]="activePill"
        [ariaLabel]="pillsAriaLabel"
        (activeChange)="pillChange.emit($event)"
      />
    }

    <div class="section-body">
      <ng-content />
    </div>
  </div>
</section>
