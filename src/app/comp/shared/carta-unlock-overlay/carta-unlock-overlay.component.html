@if (rewards.celebration(); as celeb) {
  <div
    class="unlock-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="unlock-title"
    (click)="dismiss()"
  >
    <div
      class="unlock-panel"
      [class.tone-gold]="celeb.tone === 'gold'"
      [class.tone-silver]="celeb.tone === 'silver'"
      [class.tone-cyan]="celeb.tone === 'cyan'"
      (click)="$event.stopPropagation()"
    >
      <p class="eyebrow">{{ celeb.subtitle }}</p>
      <h2 id="unlock-title">{{ celeb.title }}</h2>

      <div class="cartas-row" [class.single]="celeb.cartas.length === 1">
        @for (c of celeb.cartas; track c.id; let i = $index) {
          <article class="unlock-carta" [style.--delay]="i * 0.12 + 's'" [style.--team-color]="c.color">
            <div class="media">
              <img [src]="c.foto" [alt]="c.nombre" />
              <span class="shine" aria-hidden="true"></span>
            </div>
            <p class="serie">{{ c.serie }}</p>
            <h3>{{ c.nombre }}</h3>
            <p class="liga">{{ c.liga }}</p>
          </article>
        }
      </div>

      <button type="button" class="skip-btn" (click)="dismiss()">
        Continuar
      </button>
      <p class="hint">Solo se muestra la primera vez que ganas estas cartas.</p>
    </div>
  </div>
}
