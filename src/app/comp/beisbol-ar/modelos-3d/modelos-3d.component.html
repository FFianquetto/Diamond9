<section class="modelos-page page-shell">
  <div class="modelos-inner">
    <header>
      <p class="eyebrow">Galería 3D</p>
      <h1>Modelos de béisbol</h1>
      <p class="lede">
        Vista previa de los props 3D del escáner AR. Sube tus archivos en
        <code>public/assets/models/</code> (ver LEEME.txt).
      </p>
    </header>

    <div class="modelos-grid">
      @for (m of modelos; track m.key) {
        <article class="modelo-card" [style.--accent]="m.color">
          <div class="viewer-wrap">
            <app-ar-model-viewer
              [modelKey]="m.key"
              [accentColor]="m.color"
              animMode="spin"
              [active]="true"
            />
          </div>
          <h2>{{ m.label }}</h2>
        </article>
      }
    </div>

    <a routerLink="/ar" class="btn-primary">Probar en Escáner AR</a>
  </div>
</section>
